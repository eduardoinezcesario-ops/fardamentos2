<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controle de Fardamentos · Força Tática</title>
<style>
:root{--bg:#0d120e;--card:#161d18;--ink:#e7ece8;--mut:#98a69b;--line:#2a352d;--pri:#3f7a52;--pri2:#223329;--pri2t:#a9d8b6;--hd:#0a0f0b;--hdt:#cfe3d3;--hdh:#8fd0a2;--inp:#0f1511;--item:#131a15;--link:#8fd0a2;--b0b:#3a3110;--b0t:#f1d36e;--b1b:#12314a;--b1t:#82c4f7;--b2b:#123b1e;--b2t:#86e09b;--b3b:#272e29;--b3t:#9eaaa1;--errb:#3b1816;--errl:#7d2f29;--errt:#ff9a90;--dang:#3b1816;--dangh:#51201c;--sh:rgba(0,0,0,.55);color-scheme:dark}
:root[data-tema=claro]{--bg:#f4f5f2;--card:#fff;--ink:#1d2320;--mut:#6b746e;--line:#dde1db;--pri:#2f4a37;--pri2:#e9efe9;--pri2t:#2f4a37;--hd:#2f4a37;--hdt:#dfe9e0;--hdh:#9fc3a6;--inp:#fff;--item:#fcfdfc;--link:#2f6b43;--b0b:#f6edcf;--b0t:#8a6d1d;--b1b:#dcebf8;--b1t:#1f5f99;--b2b:#d9f0de;--b2t:#2b7a3d;--b3b:#e8eae7;--b3t:#6b746e;--errb:#fdecea;--errl:#e6b0aa;--errt:#b3261e;--dang:#fdecea;--dangh:#f6c9c4;--sh:rgba(0,0,0,.18);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--link)}
header{background:linear-gradient(90deg,#4338ca,#4f46e5 55%,#5b5bf0);color:#fff;box-shadow:0 2px 10px var(--sh)}
.hb{max-width:1100px;margin:0 auto;padding:16px 16px 10px;display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ht{font-size:19px;font-weight:700;line-height:1.15}.hsub{font-size:12px;color:#c7d2fe}
.novo{margin-left:auto;background:#10b981;color:#fff;text-decoration:none;font-weight:600;padding:10px 18px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.2);white-space:nowrap}
.novo:hover{background:#0ea371}
.hn{max-width:1100px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap}
header nav{display:contents}
header nav a{color:#e0e7ff;text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent;font-size:14px}
header nav a:hover,header nav a.on{border-color:#fff;color:#fff}
.tema{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:7px;padding:4px 10px;cursor:pointer;font:inherit}
.tema:hover{background:rgba(255,255,255,.28)}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.stat{background:var(--card);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-start;box-shadow:0 1px 4px var(--sh);border:1px solid var(--line)}
.stat small{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.stat b{font-size:28px;line-height:1.3;font-weight:700}
.sic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center}
.sic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-t small{color:var(--mut)}.s-t .sic{background:var(--b3b);color:var(--mut)}
.s-p small,.s-p b{color:#d97706}.s-p .sic{background:rgba(217,119,6,.15);color:#d97706}
.s-r small,.s-r b{color:#3b82f6}.s-r .sic{background:rgba(59,130,246,.18);color:#3b82f6}
.s-e small,.s-e b{color:#10b981}.s-e .sic{background:rgba(16,185,129,.18);color:#10b981}
main{max-width:1100px;margin:22px auto;padding:0 16px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.kpi{font-size:30px;font-weight:700}.kpi small{display:block;font-size:13px;color:var(--mut);font-weight:500}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:var(--pri2);color:var(--pri2t)}.btn.sm{padding:4px 9px;font-size:13px}
.btn.danger{background:var(--dang);color:var(--errt)}.btn.danger:hover{background:var(--dangh)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;width:100%;background:var(--inp);color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.badge{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--b3b);color:var(--b3t);white-space:nowrap}
.b0{background:var(--b0b);color:var(--b0t)}.b1{background:var(--b1b);color:var(--b1t)}.b2{background:var(--b2b);color:var(--b2t)}.b3{background:var(--b3b);color:var(--b3t)}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--item)}
.erro{background:var(--errb);border-color:var(--errl)}
.aviso{background:var(--b0b);border-color:var(--b0t);color:var(--b0t)}.aviso a{color:inherit;font-weight:700}
.hs{margin-left:auto;position:relative}.hs input{width:260px;padding:6px 10px;border-radius:8px;border:0;background:rgba(255,255,255,.95);color:#1d2320}.hs input::placeholder{color:#6b7280}
.sug{position:absolute;top:100%;right:0;width:360px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px var(--sh);z-index:30;max-height:380px;overflow:auto}
header .sug a{display:block;color:var(--ink);padding:8px 12px;border-bottom:1px solid var(--line);text-decoration:none}
header .sug a:hover,header .sug a.on{background:var(--pri2)}
.sug small{color:var(--mut)}.sug .vazio{padding:10px 12px;color:var(--mut)}
.late{color:var(--errt);font-size:13px;font-weight:600}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
form.inline{display:inline}
.print-only{display:none}.bloco,.item{break-inside:avoid}
[hidden]{display:none!important}
@media print{
 :root{--bg:#f4f5f2;--card:#fff;--ink:#1d2320;--mut:#6b746e;--line:#dde1db;--pri:#2f4a37;--pri2:#e9efe9;--pri2t:#2f4a37;--inp:#fff;--item:#fcfdfc;--link:#2f6b43;--b0b:#f6edcf;--b0t:#8a6d1d;--b1b:#dcebf8;--b1t:#1f5f99;--b2b:#d9f0de;--b2t:#2b7a3d;--b3b:#e8eae7;--b3t:#6b746e;--errb:#fdecea;--errl:#e6b0aa;--errt:#b3261e}
 header,.noprint{display:none!important}
 body{background:#fff;color:#1d2320;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 main{margin:0;max-width:none}.card{border:0;padding:0}.print-only{display:block}
 .bloco{border-bottom:1px solid #bbb;padding:0 0 10px;margin-bottom:12px}
}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#login .card{width:100%;max-width:380px;margin:0}
#login .marca{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#login .logo{background:#4f46e5}
#nuvem{position:fixed;right:12px;bottom:12px;z-index:40;font-size:12px;padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);box-shadow:0 2px 8px var(--sh)}
#nuvem.ruim{background:var(--b0b);color:var(--b0t);border-color:var(--b0t);font-weight:600}
details.grp{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--item)}
details.grp>summary{cursor:pointer;padding:10px 12px;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:'▸';color:var(--mut);display:inline-block;transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp .corpo{padding:0 12px 12px}
details.grp .ped+.ped{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.marca-img{height:56px;width:auto;display:block}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#facc15;box-shadow:0 0 0 2px rgba(250,204,21,.35);margin-right:6px;vertical-align:middle;flex:none}
#npend:not(:empty){background:#facc15;color:#000;border-radius:99px;padding:0 7px;font-size:11px;font-weight:700;margin-left:5px}
</style>
<script>
try{var _t=localStorage.getItem('tema');if(_t)document.documentElement.setAttribute('data-tema',_t)}catch(e){}
</script>

(function(){
'use strict';

/* ======================= constantes ======================= */

const pad=n=>String(n).padStart(2,'0');
function agora(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())}
function hoje(){return agora().slice(0,10)}
function fmt(dt){if(!dt)return '—';const m=/^(\d{4})-(\d\d)-(\d\d)[ T](\d\d):(\d\d)/.exec(dt);return m?m[3]+'/'+m[2]+'/'+m[1]+' '+m[4]+':'+m[5]:dt}
function dia(d){if(!d)return '—';const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(d);return m?m[3]+'/'+m[2]+'/'+m[1]:d}
const dtl=dt=>dt?String(dt).slice(0,16).replace(' ','T'):'';
function deDtl(v){v=(v||'').trim();if(!v)return null;if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v))throw new Error('data');return v.slice(0,16).replace('T',' ')+':00'}
function deDia(v){v=(v||'').trim();if(!v)return null;if(!/^\d{4}-\d\d-\d\d$/.test(v))throw new Error('data');return v}
function entradaDe(v,antigo){v=(v||'').trim();if(!v)return antigo||agora();if(!/^\d{4}-\d\d-\d\d$/.test(v))throw new Error('data');if(antigo&&antigo.slice(0,10)===v)return antigo;return v+' '+(v===hoje()?agora().slice(11):'12:00:00')}
function dtlEdit(v,antigo){const n=deDtl(v);if(!n)return antigo||null;if(antigo&&n.slice(0,16)===antigo.slice(0,16))return antigo;return n}
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/\s+/).filter(Boolean).join(' ')}
const clean=s=>String(s||'').trim().replace(/\s+/g,' ');
const digits=s=>String(s||'').replace(/[^0-9]/g,'');
const qtdNum=v=>Math.max(1,parseInt(v||'1',10)||1);
function safeVoltar(u){u=(u||'').trim();return(u.charAt(0)==='/'&&u.charAt(1)!=='/')?u:''}

function nuvemStatus(t,ruim){const e=$('#nuvem');if(!e)return;e.textContent=t||'';e.className='noprint'+(ruim?' ruim':'');e.hidden=!t}
async function baixar(){
  const r=await sb.from('app_state').select('dados,versao').eq('id',1).single();
  if(r.error)throw r.error;
  DB=normalizar(r.data.dados);VERSAO=+r.data.versao;memOnly=false;
}
async function gravar(){
  if(!sujoNuvem)return;
  sujoNuvem=false;
  let r;
  try{r=await sb.from('app_state').update({dados:DB,versao:VERSAO+1,atualizado_em:new Date().toISOString()}).eq('id',1).eq('versao',VERSAO).select('versao')}
  catch(e){r={error:e}}
  if(r.error){sujoNuvem=true;memOnly=true;nuvemStatus('⚠ Sem conexão — ainda não salvo',true);return}
  if(!r.data||!r.data.length){
    try{await baixar()}
    catch(e){await sb.auth.signOut();alert('Sua sessão expirou. Entre de novo. A última alteração pode não ter sido salva.');return}
    nuvemStatus('⚠ Alteração não salva',true);
    alert('Outra pessoa alterou os dados ao mesmo tempo, e a sua última alteração NÃO foi salva.\n\nA tela foi atualizada com os dados mais novos. Confira e refaça a alteração.');
    render();return;
  }
  VERSAO=+r.data[0].versao;memOnly=false;nuvemStatus('☁ Salvo');
}
function salvar(){sujoNuvem=true;nuvemStatus('☁ Salvando…');fila=fila.then(gravar,gravar);return true}
async function atualizar(){
  await fila;
  if(sujoNuvem){await gravar();if(sujoNuvem)throw new Error('offline')}
  const r=await sb.from('app_state').select('versao').eq('id',1).single();
  if(r.error)throw r.error;
  if(+r.data.versao!==VERSAO){await baixar()}
}
function mut(fn){return async function(){
  if(ocupado)return;ocupado=true;
  const a=arguments;
  try{await atualizar()}catch(e){ocupado=false;alert('Sem conexão com o servidor. Nada foi alterado. Confira a internet e tente de novo.');return}
  try{fn.apply(null,a)}catch(e){console.error(e);alert('Erro: '+e.message)}
  ocupado=false;
}}
async function checar(){
  if(!sb||!DB||ocupado)return;
  try{
    if(sujoNuvem){await gravar();return}
    const r=await sb.from('app_state').select('versao').eq('id',1).single();
    if(r.error)throw r.error;
    memOnly=false;
    if(+r.data.versao!==VERSAO&&!formSujo&&!ocupado&&!sujoNuvem){await baixar();render()}
    if(!sujoNuvem)nuvemStatus('☁ Salvo');
  }catch(e){memOnly=true;nuvemStatus('⚠ Sem conexão',true)}
}
function snapshots(){return SNAP}
function snapshot(motivo){
  const reg={data:agora(),motivo:motivo,dados:JSON.stringify(DB)};
  SNAP.push(reg);while(SNAP.length>MAX_SNAP)SNAP.shift();
  sb.from('app_snapshots').insert({data:reg.data,motivo:motivo,dados:JSON.parse(reg.dados)}).then(async r=>{
    if(r.error)return;
    const l=await sb.from('app_snapshots').select('id').order('id',{ascending:false});
    if(l.data&&l.data.length>MAX_SNAP)await sb.from('app_snapshots').delete().in('id',l.data.slice(MAX_SNAP).map(x=>x.id));
  }).catch(()=>{});
}

const ped=id=>DB.pedidos.find(p=>p.id===+id);

function achaDup(nome,ignorar){const a=norm(nome);return DB.clientes.find(c=>c.id!==ignorar&&norm(c.nome)===a)||null}
function diff(antigo,novo,campos){
  const out=[];
  Object.keys(campos).forEach(k=>{const a=antigo[k]==null?'':antigo[k],b=novo[k]==null?'':novo[k];if(String(a)!==String(b))out.push(campos[k]+": '"+a+"' → '"+b+"'")});
  return out.join('; ');
}

function resumoPedidos(id){return pedidosDe(id).map(x=>x.quantidade+'x '+x.item+' '+(x.tamanho||'')+' '+(x.observacao||'')).join(' · ')}
function hay(c){return norm(c.nome)+' '+norm(c.telefone)+' '+digits(c.telefone)+' '+norm(resumoPedidos(c.id))}
function casa(t,h){
  if(h.indexOf(t)>-1)return true;
  if(/^[0-9()+.\-]+$/.test(t)){const d=digits(t);return d!==''&&h.indexOf(d)>-1}
  return false;
}
function listaClientes(q){
  let l=DB.clientes.map(c=>{const ps=pedidosDe(c.id);return Object.assign({},c,{pedidos:ps,total:ps.length,abertos:ps.filter(p=>p.status!=='Entregue').length,_h:hay(c)})});
  l.sort((a,b)=>norm(a.nome)<norm(b.nome)?-1:norm(a.nome)>norm(b.nome)?1:0);
  const t=norm(q).split(' ').filter(Boolean);
  if(t.length){
    l=l.filter(c=>t.every(x=>casa(x,c._h)));
    l.sort((a,b)=>{const sa=norm(a.nome).indexOf(t[0])===0?0:1,sb=norm(b.nome).indexOf(t[0])===0?0:1;return sa-sb||(norm(a.nome)<norm(b.nome)?-1:1)});
  }
  return l;
}

function v404(){return '<div class="card"><h1>Não encontrado</h1><p>Esse cadastro não existe (talvez tenha sido apagado).</p><a class="btn" href="#/">Voltar ao painel</a></div>'}

/* ======================= roteamento ======================= */
let ultimoPath=null;
function parseHash(){const h=(location.hash||'#/').slice(1)||'/';const i=h.indexOf('?');return{path:i<0?h:h.slice(0,i),q:new URLSearchParams(i<0?'':h.slice(i+1))}}
function vPendencias(){
  const L=DB.pedidos.filter(p=>p.pendencia&&p.status!=='Entregue').sort((a,b)=>a.criado_em<b.criado_em?-1:1);
  return '<h1>🟡 Pendências</h1><p class="mut">Pedidos que estão faltando algo. Quando resolver, clique em “Resolvido”.</p>'+(L.map(p=>{const c=cli(p.cliente_id)||{nome:'?',telefone:''};
    return '<div class="card"><div class="row" style="justify-content:space-between"><b><i class="dot"></i><a href="#/clientes/'+c.id+'" style="color:inherit">'+esc(c.nome)+'</a></b><span class="mut">'+esc(p.status)+'</span></div>'+
    '<div class="mut" style="margin:4px 0">'+esc([p.quantidade+'x '+p.item,p.tamanho&&('tam. '+p.tamanho),p.observacao].filter(Boolean).join(' · '))+'</div>'+
    '<div style="color:#facc15;font-weight:600;white-space:normal">Falta: '+esc(p.pendencia)+'</div>'+
    '<div class="row" style="margin-top:8px"><button class="btn" data-act="resolver" data-id="'+p.id+'">✔ Resolvido</button><a class="btn sec" href="#/pedidos/'+p.id+'/editar'+lnkVoltar('/pendencias')+'">✏ Editar</a></div></div>'}).join('')||'<div class="card mut">Nenhum pedido com pendência. 👍</div>');
}
function rota(path,q){
  let m;
  if(path==='/pendencias')return vPendencias();
  if(path==='/')return vPainel();
  if(path==='/clientes')return vClientes(q);
  if(path==='/clientes/novo')return vClienteForm(null);
  if((m=/^\/clientes\/(\d+)$/.exec(path)))return vClienteDetalhe(+m[1]);
  if((m=/^\/clientes\/(\d+)\/editar$/.exec(path))){const c=cli(+m[1]);return c?vClienteForm(c):v404()}
  if(path==='/pedidos')return vPedidos(q);
  if(path==='/pedidos/novo')return vPedidoForm(null,q);
  if((m=/^\/pedidos\/(\d+)\/editar$/.exec(path))){const p=ped(+m[1]);return p?vPedidoForm(p,q):v404()}
  if(path==='/imprimir')return vImprimir(q);
  if(path==='/historico')return vHistorico();
  return v404();
}
function bannerHTML(){
  let b='';
  if(memOnly)b+='<div class="card aviso noprint"><b>⚠ Sem conexão com o servidor.</b> O que você lançar agora ainda não foi salvo. Confira a internet; o sistema tenta de novo sozinho.</div>';
  return b;
}
function render(){
  if(!DB)return;
  formSujo=false;
  const {path,q}=parseHash();
  let html;
  try{html=rota(path,q)}catch(e){console.error(e);html='<div class="card erro"><b>Erro ao abrir esta tela.</b><br>'+esc(e.message)+'</div>'}
  $('#app').innerHTML=(path==='/imprimir'?'':bannerHTML())+html;
  $('#nomes').innerHTML=DB.clientes.map(c=>'<option value="'+esc(c.nome)+'">').join('');
  const np=DB.pedidos.filter(p=>p.pendencia&&p.status!=='Entregue').length;const ne=$('#npend');if(ne)ne.textContent=np?String(np):'';
  document.querySelectorAll('header nav a').forEach(a=>{const n=a.getAttribute('data-nav');a.classList.toggle('on',n===path||(n!=='/'&&path.indexOf(n+'/')===0&&n!=='/pedidos'&&n!=='/clientes'))});
  if(path!==ultimoPath){window.scrollTo(0,0);ultimoPath=path}
  depois(path);
}
function depois(path){
  const f=$('#filtro');
  if(f&&(path==='/clientes'||path==='/pedidos')){
    const linhas=[].slice.call(document.querySelectorAll(path==='/clientes'?'#tab tr[data-busca]':'.pedido')),nada=$('#nada'),cont=$('#cont');
    const filtrar=()=>{const t=norm(f.value).split(' ').filter(Boolean);let vis=0;
      linhas.forEach(l=>{const h=l.getAttribute('data-busca'),ok=t.every(x=>path==='/clientes'?casa(x,h):h.indexOf(x)>-1);l.style.display=ok?'':'none';if(ok)vis++});
      if(nada)nada.style.display=(vis===0&&linhas.length)?'':'none';
      if(cont)cont.textContent=f.value.trim()?vis+' encontrado(s)':'';};
    f.addEventListener('input',filtrar);filtrar();f.focus();
  }
  const dica=$('#dica');if(dica)atualizarDica();
}
function atualizarDica(){
  const f=document.querySelector('[name=cliente_nome]'),d=$('#dica'),tb=$('#tel-box');if(!f||!d)return;
  const t=norm(f.value);
  if(!t){d.textContent='';tb.style.display='';return}
  const ex=DB.clientes.find(c=>norm(c.nome)===t),fm=document.querySelector('form[data-form=pedidoNovo]');
  if(ex&&fm&&+fm.dataset.cid===ex.id){d.textContent='✔ Novo pedido para este cliente já cadastrado.';d.style.color='var(--b2t)';tb.style.display='none'}
  else if(ex){d.textContent='⚠ Cliente já cadastrado — não é possível cadastrar de novo.';d.style.color='var(--errt)';tb.style.display='none'}
  else{d.textContent='➕ Cliente novo — será cadastrado automaticamente ao salvar.';d.style.color='var(--b1t)';tb.style.display=''}
}
const ir=h=>{if(location.hash===h)render();else location.hash=h};

/* ======================= ações ======================= */
function erroForm(html){const e=$('#erro');e.innerHTML='<div class="card erro" style="max-width:760px"><b>⚠ '+html+'</b></div>';window.scrollTo(0,0)}
function mudarStatus(pid,novo,deSelect){
  const p=ped(pid);if(!p||p.status===novo)return;
  if(deSelect){if(!confirm('Alterar o status de "'+p.item+'" para "'+novo+'"?')){render();return}}
  else if(novo==='Entregue'&&!confirm('Confirmar entrega ao cliente?'))return;
  const t=agora(),old=p.status;
  p.status=novo;p.atualizado_em=t;p.entregue_em=novo==='Entregue'?t:null;
  log('Status alterado',p.item+': '+old+' → '+novo,p.cliente_id,p.id);
  salvar();
}
function apagarCliente(id){
  const c=cli(id);if(!c)return;
  const ps=pedidosDe(id);
  if(!confirm(avisoApagar(c.nome,ps.length,ps.filter(p=>p.status!=='Entregue').length)))return;
  snapshot('antes de apagar o cliente '+c.nome);
  const resumo=ps.map(p=>(p.quantidade+'x '+p.item+' '+(p.tamanho||'')).replace(/ +/g,' ').trim()+' ('+p.status+')').join('; ')||'sem pedidos';
  DB.historico.forEach(h=>{if(h.cliente_id===id)h.detalhe='[cliente apagado: '+c.nome+'] '+h.detalhe});
  DB.pedidos=DB.pedidos.filter(p=>p.cliente_id!==id);
  DB.clientes=DB.clientes.filter(x=>x.id!==id);
  log('Cliente apagado',c.nome+' · tel. '+(c.telefone||'—')+' · pedidos removidos: '+resumo,id,null);
  salvar();ir('#/clientes');
}

const FORMS={
  clienteNovo:f=>{
    const nome=clean(f.nome.value);

  },

    const ps=pedidosDe(id),novos={};
    try{
      ps.forEach(p=>{const i=p.id,g=n=>f.elements[n+'_'+i];
        const n={item:clean(g('item').value)||p.item,tamanho:clean(g('tamanho').value),quantidade:qtdNum(g('qtd').value),observacao:g('obs').value.trim(),
          criado_em:entradaDe(g('entrada').value,p.criado_em),previsao_entrega:deDia(g('previsao').value)||'',
          entregue_em:p.status==='Entregue'?dtlEdit(g('entregue').value,p.entregue_em):p.entregue_em};

    }catch(e){return erroForm('Data ou quantidade inválida. Confira os campos.')}

    ps.forEach(p=>{const n=novos[p.id],m=diff(p,n,rot);

        log('Pedido editado',p.item+': '+m,id,p.id)}});
    salvar();ir('#/clientes/'+id);
  },
  pedidoNovo:f=>{

      return erroForm('Cliente já cadastrado. O pedido não foi lançado.<br>Cadastro existente: <a href="#/clientes/'+c.id+'"><b>'+esc(c.nome)+'</b></a> '+esc(c.telefone)+(ab?'<br><br>Abra o pedido dele para alterar:'+ab:'')+'<br><br><span class="mut">Ou, se for outro pedido deste cliente: <a href="#/pedidos/novo?cliente_id='+c.id+'">lançar um novo pedido para ele</a></span>');

  },
  pedidoEditar:f=>{

      criado_em:entradaDe(f.criado_em.value,p.criado_em),previsao_entrega:deDia(f.previsao_entrega.value)||'',
      entregue_em:p.status==='Entregue'?dtlEdit(f.entregue_em.value,p.entregue_em):p.entregue_em}}
    catch(e){return erroForm('Data ou quantidade inválida.')}
    const m=diff(p,n,{item:'Item',tamanho:'Tamanho',quantidade:'Qtd.',observacao:'Obs.',pendencia:'Falta',criado_em:'Data de entrada',previsao_entrega:'Previsão de entrega',entregue_em:'Data da entrega'});
    if(m){p.item=n.item;p.tamanho=n.tamanho;p.quantidade=n.quantidade;p.observacao=n.observacao;p.pendencia=n.pendencia;p.criado_em=n.criado_em;p.previsao_entrega=n.previsao_entrega||null;p.entregue_em=n.entregue_em||null;p.atualizado_em=agora();
      log('Pedido editado',m,p.cliente_id,p.id);salvar()}
    ir('#'+(safeVoltar(f.dataset.voltar)||'/clientes/'+p.cliente_id));
  }
};

Object.keys(FORMS).forEach(k=>{FORMS[k]=mut(FORMS[k])});

/* ======================= eventos globais ======================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&ACTS[t.dataset.act]){e.preventDefault();ACTS[t.dataset.act](t,e)}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.chg&&CHG[t.dataset.chg])CHG[t.dataset.chg](t);
});
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.inp==='dica')atualizarDica();if(e.target.closest&&e.target.closest('form[data-form]'))formSujo=true});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset&&FORMS[f.dataset.form]){e.preventDefault();FORMS[f.dataset.form](f)}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.k){if(d.open)ABERTOS.add(d.dataset.k);else ABERTOS.delete(d.dataset.k)}},true);
window.addEventListener('hashchange',render);
$('#btn-tema').addEventListener('click',()=>{
  const h=document.documentElement,n=h.getAttribute('data-tema')==='claro'?'escuro':'claro';
  h.setAttribute('data-tema',n);try{localStorage.setItem('tema',n)}catch(e){}
});

/* busca do topo, com lista enquanto digita */
(function(){
  const i=$('#busca-topo'),box=$('#sug');let idx=-1;
  const fechar=()=>{box.hidden=true;idx=-1};
  i.addEventListener('input',()=>{
    const q=i.value.trim();if(!q){fechar();return}
    const l=listaClientes(q).slice(0,12);idx=-1;
    box.innerHTML=l.length?l.map(c=>'<a href="#/clientes/'+c.id+'"><b>'+esc(c.nome)+'</b><br><small>'+esc(c.telefone||'sem telefone')+' · '+c.abertos+' em aberto</small></a>').join(''):'<div class="vazio">Nenhum cliente encontrado</div>';
    box.hidden=false;
  });
  i.addEventListener('keydown',e=>{
    const as=box.querySelectorAll('a');
    if(e.key==='ArrowDown'&&as.length){e.preventDefault();idx=Math.min(idx+1,as.length-1)}
    else if(e.key==='ArrowUp'&&as.length){e.preventDefault();idx=Math.max(idx-1,0)}
    else if(e.key==='Enter'){e.preventDefault();
      if(idx>=0&&as[idx]){location.hash=as[idx].getAttribute('href');}
      else{const ex=listaClientes(i.value).filter(c=>norm(c.nome)===norm(i.value));location.hash=ex.length===1?'#/clientes/'+ex[0].id:'#/clientes?q='+encodeURIComponent(i.value.trim())}
      fechar();i.blur();return}
    else if(e.key==='Escape'){fechar();return}else return;
    for(let k=0;k<as.length;k++)as[k].classList.toggle('on',k===idx);
  });
  document.addEventListener('click',e=>{if(e.target!==i&&!box.contains(e.target))fechar();else if(box.contains(e.target))setTimeout(fechar,0)});
})();

/* ======================= login e inicialização ======================= */
function msgLogin(t){const m=$('#login-msg');m.textContent=t||'';m.style.display=t?'block':'none'}
function telaLogin(msg){
  DB=null;
  $('#login').hidden=false;msgLogin(msg);
  $('#app').innerHTML='';$('#btn-sair').hidden=true;nuvemStatus('');
  $('#lg-ok').disabled=false;$('#lg-ok').textContent='Entrar';
}
async function migrarLocal(){
  if(DB.clientes.length||DB.pedidos.length)return;
  let loc=null;
  try{const r=localStorage.getItem(KEY);if(r)loc=normalizar(JSON.parse(r))}catch(e){}
  if(!loc||(!loc.clientes.length&&!loc.pedidos.length))return;
  if(confirm('Encontrei dados salvos neste navegador ('+loc.clientes.length+' cliente(s) e '+loc.pedidos.length+' pedido(s)).\n\nEnviar para a nuvem agora? Os dados daqui NÃO são apagados.')){
    DB=loc;log('Dados importados','Migração dos dados que estavam só neste navegador',null,null);salvar();await fila;
  }
}
async function entrar(){
  $('#login').hidden=true;
  $('#app').innerHTML='<div class="card">Carregando dados…</div>';
  try{await baixar()}
  catch(e){
    $('#app').innerHTML='<div class="card erro"><b>⚠ Não foi possível carregar os dados.</b><br>'+esc((e&&e.message)||e)+'<br><br>Confira a internet e se o SQL das tabelas foi executado no Supabase.<br><br><button class="btn" onclick="location.reload()">Tentar de novo</button></div>';
    $('#btn-sair').hidden=false;return;
  }
  await migrarLocal();
  $('#btn-sair').hidden=false;nuvemStatus('☁ Salvo');
  render();
  if(!timer)timer=setInterval(checar,15000);
}
function iniciar(){
  if(!window.supabase){$('#app').innerHTML='<div class="card erro"><b>⚠ Não foi possível carregar a biblioteca do Supabase.</b> Confira a internet e atualize a página (Ctrl+F5).</div>';return}
  if(!/^https:\/\//.test(SUPABASE_URL)||SUPABASE_KEY.length<30){$('#app').innerHTML='<div class="card erro"><b>⚠ Falta configurar a conexão.</b> Preencha SUPABASE_URL e SUPABASE_KEY no começo do código do index.html.</div>';return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')telaLogin()});
  sb.auth.getSession().then(r=>{if(r.data&&r.data.session)entrar();else telaLogin()}).catch(()=>telaLogin('Não foi possível conectar. Confira a internet.'));
}
$('#login-form').addEventListener('submit',async e=>{
  e.preventDefault();msgLogin('');
  const btn=$('#lg-ok');btn.disabled=true;btn.textContent='Entrando…';
  let r;
  try{r=await sb.auth.signInWithPassword({email:$('#lg-email').value.trim(),password:$('#lg-senha').value})}
  catch(x){r={error:x}}
  if(r.error){btn.disabled=false;btn.textContent='Entrar';msgLogin(/fetch|network/i.test(r.error.message||'')?'Sem conexão com o servidor.':'E-mail ou senha incorretos.');return}
  $('#lg-senha').value='';btn.disabled=false;btn.textContent='Entrar';
  entrar();
});
$('#btn-sair').addEventListener('click',async()=>{
  try{await fila}catch(e){}
  if(sujoNuvem&&!confirm('Há alterações ainda não salvas. Sair mesmo assim?'))return;
  sb.auth.signOut();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checar()});
window.addEventListener('beforeunload',e=>{if(sujoNuvem){e.preventDefault();e.returnValue=''}});

iniciar();
})();
</script>
